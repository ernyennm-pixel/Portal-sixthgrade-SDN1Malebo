                }
                const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Rule 3: Auth Before Queries
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                currentFirebaseUser = auth.currentUser;
                if (!currentFirebaseUser) return;

                // Rule 1: Strict Path under /artifacts/{appId}/public/data/{collectionName}
                portalDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'portal_kelas6_malebo', 'main_state_v3');

                // Check if document exists, if not initialize with DEFAULT_PORTAL_DATA
                const snap = await getDoc(portalDocRef);
                if (!snap.exists()) {
                    await setDoc(portalDocRef, {
                        payload: JSON.stringify(DEFAULT_PORTAL_DATA),
                        updatedAt: new Date().toISOString()
                    });
                }

                // Real-time listener across all devices
                if (unsubPortal) { try { unsubPortal(); } catch (e) {} }
                if (localStorage.getItem('portal_pending')) pendingSave = true;
                unsubPortal = onSnapshot(portalDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const raw = docSnap.data();
                        if (raw && raw.payload) {
                            try {
                                const parsed = JSON.parse(raw.payload);
                                // Merge safely ensuring students array is intact
                                appState.data = { ...DEFAULT_PORTAL_DATA, ...parsed };
                                if (!appState.data.students || appState.data.students.length === 0) {
                                    appState.data.students = INITIAL_STUDENTS;
                                }
                                appState.isCloudReady = true;
                                cloudRetry = 0;
                                updateCloudBadge(true);
                                if (pendingSave) { flushPendingSave(); } else { renderCurrentView(); }
                            } catch (e) {
                                console.error("Gagal parsing data cloud:", e);
                            }
                        }
                    }
                }, (error) => {
                    console.error("Firestore onSnapshot error:", error);
                    appState.isCloudReady = false;
                    updateCloudBadge(false);
                    scheduleCloudRetry();
                });

            } catch (err) {
                console.error("Cloud init error:", err);
                appState.isCloudReady = false;
                updateCloudBadge(false);
                scheduleCloudRetry();
            }
        }

        async function saveToCloud(successMsg = "Perubahan disimpan ke Cloud & tersinkron ke perangkat siswa!") {
            renderCurrentView(); // Instant optimistic UI update
            if (!db || !currentFirebaseUser || !portalDocRef) {
                pendingSave = true;
                try { localStorage.setItem('portal_pending', JSON.stringify(appState.data)); } catch (e) {}
                showToast(successMsg + " (Tersimpan lokal, akan otomatis disinkronkan saat Cloud tersambung)", "info");
                initCloudSync();

            try {

                    updatedAt: new Date().toISOString(),
                    updatedBy: appState.currentUser.name
                });

                pendingSave = true;
                try { localStorage.setItem('portal_pending', JSON.stringify(appState.data)); } catch (e) {}

        window.saveStudentForm = function(e, oldNis) {
            e.preventDefault();
            const newNis = document.getElementById('st-nis').value.trim();
            const payload = {
                no: Number(document.getElementById('st-no').value) || 1,
                nama: document.getElementById('st-nama').value.toUpperCase().trim(),
                nis: newNis,
                nisn: document.getElementById('st-nisn').value.trim(),
                jk: document.getElementById('st-jk').value,
                alamat: document.getElementById('st-alamat').value.trim(),
                ttl: document.getElementById('st-ttl').value.trim()
            };
            if (oldNis) {
                const idx = appState.data.students.findIndex(s => s.nis === oldNis);
                if (idx !== -1) {
                    appState.data.students[idx] = payload;
                }
                // Migrate grades & fees if NIS changed
                if (oldNis !== newNis) {
                    if (appState.data.grades[oldNis]) {
                        appState.data.grades[newNis] = appState.data.grades[oldNis];
                        delete appState.data.grades[oldNis];
                    }
                    if (appState.data.fees[oldNis]) {
                        appState.data.fees[newNis] = appState.data.fees[oldNis];
                        delete appState.data.fees[oldNis];
                    }
                }
            } else {
                appState.data.students.push(payload);
            }
            // Sort by attendance number
            appState.data.students.sort((a, b) => a.no - b.no);
            closeModal();
            saveToCloud("Data siswa berhasil diperbarui!");
        };

                color: 'from-indigo-500 to-cyan-500'
            });
            closeModal();
            saveToCloud("Dokumentasi berhasil ditambahkan!");
        };

        // Fee Modal
        window.openFeeModal = function(nis) {
            const st = appState.data.students.find(s => s.nis === nis);
            const f = appState.data.fees[nis] || { kasBulanIni: 'Lunas', saldoTabungan: 50000, keterangan: 'Aktif' };
            openModal(`
                <form onsubmit="saveFee(event, '${nis}')" class="p-6 space-y-3">
                    <h3 class="text-base font-bold text-slate-800">Kas & Tabungan: ${st.nama}</h3>
                    <div>
                        <label class="text-xs font-semibold">Status Kas Bulan Ini</label>
                        <select id="fe-status" class="w-full mt-1 text-xs border rounded-xl px-3 py-2">
                            <option value="Lunas" ${f.kasBulanIni === 'Lunas' ? 'selected' : ''}>Lunas</option>
                            <option value="Belum Lunas" ${f.kasBulanIni !== 'Lunas' ? 'selected' : ''}>Belum Lunas</option>
                        </select>
                    </div>
                    <div><label class="text-xs font-semibold">Saldo Tabungan (Rp)</label><input type="number" id="fe-saldo" required value="${f.saldoTabungan}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div><label class="text-xs font-semibold">Keterangan</label><input type="text" id="fe-ket" required value="${f.keterangan}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs bg-slate-100 rounded-xl font-semibold">Batal</button>
                        <button type="submit" class="px-4 py-2 text-xs bg-teal-600 text-white rounded-xl font-semibold">Simpan</button>
                    </div>
                </form>
            `);
        };

        window.saveFee = function(e, nis) {
            e.preventDefault();
            appState.data.fees[nis] = {
                kasBulanIni: document.getElementById('fe-status').value,
                saldoTabungan: Number(document.getElementById('fe-saldo').value),
                keterangan: document.getElementById('fe-ket').value
            };
            closeModal();
            saveToCloud("Catatan kas & tabungan diperbarui!");
        };

        // Notice Modal
        window.openNoticeModal = function(id = null) {
            const n = id ? appState.data.notices.find(x => x.id === id) : null;
            openModal(`
                <form onsubmit="saveNotice(event, '${id || ''}')" class="p-6 space-y-3">
                    <h3 class="text-base font-bold text-slate-800">${n ? 'Edit Pengumuman' : 'Buat Pengumuman Baru'}</h3>
                    <div><label class="text-xs font-semibold">Judul Pengumuman</label><input type="text" id="nt-title" required value="${n ? n.title : ''}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div><label class="text-xs font-semibold">Label</label><input type="text" id="nt-tag" required value="${n ? n.tag : 'BARU'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div><label class="text-xs font-semibold">Isi Pengumuman</label><textarea id="nt-content" required rows="3" class="w-full mt-1 text-xs border rounded-xl px-3 py-2">${n ? n.content : ''}</textarea></div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs bg-slate-100 rounded-xl font-semibold">Batal</button>
                        <button type="submit" class="px-4 py-2 text-xs bg-purple-600 text-white rounded-xl font-semibold">Terbitkan</button>
                    </div>
                </form>
            `);
        };

        window.saveNotice = function(e, id) {
            e.preventDefault();
            const obj = {
                id: id || 'not-' + Date.now(),
                title: document.getElementById('nt-title').value,
                tag: document.getElementById('nt-tag').value.toUpperCase(),
                content: document.getElementById('nt-content').value,
                date: '12 Nov 2026'
            };
            if (id) {
                const i = appState.data.notices.findIndex(x => x.id === id);
                if (i !== -1) appState.data.notices[i] = obj;
            } else {
                appState.data.notices.unshift(obj);
            }
            closeModal();
            saveToCloud("Pengumuman diterbitkan ke perangkat siswa!");
        };

        // Assignment Modal
        window.openAssignmentModal = function(id = null) {
            const a = id ? appState.data.assignments.find(x => x.id === id) : null;
            const attType = a && a.attachmentType ? a.attachmentType : 'none';
            openModal(`
                <form onsubmit="saveAssignment(event, '${id || ''}')" class="p-6 space-y-3 max-h-[85vh] overflow-y-auto">
                    <h3 class="text-base font-bold text-slate-800">${a ? 'Edit Tugas' : 'Tambah Tugas Kelas 6'}</h3>
                    <div><label class="text-xs font-semibold">Mata Pelajaran</label><input type="text" id="as-sub" required value="${a ? a.subject : 'Matematika'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div><label class="text-xs font-semibold">Judul Tugas</label><input type="text" id="as-title" required value="${a ? a.title : ''}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div><label class="text-xs font-semibold">Batas Pengumpulan</label><input type="text" id="as-due" required value="${a ? a.dueDate : '20 Nov 2026'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div><label class="text-xs font-semibold">Instruksi Tugas</label><textarea id="as-desc" required rows="2" class="w-full mt-1 text-xs border rounded-xl px-3 py-2">${a ? a.desc : ''}</textarea></div>
                    ${renderAttachmentFormFields(attType, a ? a.attachmentName : '', a ? a.attachmentUrl : '')}
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs bg-slate-100 rounded-xl font-semibold">Batal</button>
                        <button type="submit" class="px-4 py-2 text-xs bg-orange-600 text-white rounded-xl font-semibold">Simpan Tugas</button>
                    </div>
                </form>
            `);
        };

        window.saveAssignment = async function(e, id) {
            e.preventDefault();
            const existing = id ? appState.data.assignments.find(x => x.id === id) : null;
            const att = await extractAttachmentData(existing);
            if (!att) return;
            const obj = {
                id: id || 'asg-' + Date.now(),
                subject: document.getElementById('as-sub').value,
                title: document.getElementById('as-title').value,
                dueDate: document.getElementById('as-due').value,
                desc: document.getElementById('as-desc').value,
                status: 'Aktif',
                ...att
            };
            if (id) {
                const i = appState.data.assignments.findIndex(x => x.id === id);
                if (i !== -1) appState.data.assignments[i] = obj;
            } else {
                appState.data.assignments.unshift(obj);
            }
            closeModal();
            saveToCloud("Tugas & lampiran berhasil disimpan!");
        };

        // Exam Modal
        window.openExamModal = function(id = null) {
            const ex = id ? appState.data.exams.find(x => x.id === id) : null;
            const attType = ex && ex.attachmentType ? ex.attachmentType : 'none';
            openModal(`
                <form onsubmit="saveExam(event, '${id || ''}')" class="p-6 space-y-3 max-h-[85vh] overflow-y-auto">
                    <h3 class="text-base font-bold text-slate-800">${ex ? 'Edit Jadwal Ujian' : 'Tambah Jadwal Ujian'}</h3>
                    <div><label class="text-xs font-semibold">Mata Pelajaran</label><input type="text" id="ex-sub" required value="${ex ? ex.subject : ''}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div><label class="text-xs font-semibold">Hari & Tanggal</label><input type="text" id="ex-date" required value="${ex ? ex.date : 'Jumat, 11 Des 2026'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="text-xs font-semibold">Waktu</label><input type="text" id="ex-time" required value="${ex ? ex.time : '07:30 - 09:30'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                        <div><label class="text-xs font-semibold">Ruang</label><input type="text" id="ex-room" required value="${ex ? ex.room : 'Ruang Kelas 6'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    </div>
                    ${renderAttachmentFormFields(attType, ex ? ex.attachmentName : '', ex ? ex.attachmentUrl : '')}
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs bg-slate-100 rounded-xl font-semibold">Batal</button>
                        <button type="submit" class="px-4 py-2 text-xs bg-emerald-600 text-white rounded-xl font-semibold">Simpan</button>
                    </div>
                </form>
            `);
        };

        window.saveExam = async function(e, id) {
            e.preventDefault();
            const existing = id ? appState.data.exams.find(x => x.id === id) : null;
            const att = await extractAttachmentData(existing);
            if (!att) return;
            const obj = {
                id: id || 'ex-' + Date.now(),
                subject: document.getElementById('ex-sub').value,
                date: document.getElementById('ex-date').value,
                time: document.getElementById('ex-time').value,
                room: document.getElementById('ex-room').value,
                ...att
            };
            if (id) {
                const i = appState.data.exams.findIndex(x => x.id === id);
                if (i !== -1) appState.data.exams[i] = obj;
            } else {
                appState.data.exams.push(obj);
            }
            closeModal();
            saveToCloud("Jadwal ujian & lampiran diperbarui!");
        };

        // Library Modal
        window.openLibraryModal = function(id = null) {
            const lib = id ? appState.data.library.find(x => x.id === id) : null;
            const attType = lib ? (lib.attachmentType || 'link') : 'link';
            const existingUrl = lib ? (lib.attachmentUrl || lib.link || '') : '';
            openModal(`
                <form onsubmit="saveLibrary(event, '${id || ''}')" class="p-6 space-y-3 max-h-[85vh] overflow-y-auto">
                    <h3 class="text-base font-bold text-slate-800">${lib ? 'Edit Buku / Bahan Ajar' : 'Tambah Buku / Bahan Ajar'}</h3>
                    <div><label class="text-xs font-semibold">Judul Buku / Materi</label><input type="text" id="lb-title" required value="${lib ? lib.title : ''}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="text-xs font-semibold">Kategori</label><input type="text" id="lb-cat" required value="${lib ? lib.category : 'Modul Belajar'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                        <div><label class="text-xs font-semibold">Penerbit / Penulis</label><input type="text" id="lb-auth" required value="${lib ? lib.author : 'SDN 1 Malebo'}" class="w-full mt-1 text-xs border rounded-xl px-3 py-2"></div>
                    </div>
                    ${renderAttachmentFormFields(attType, lib ? lib.attachmentName : '', existingUrl, true)}
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs bg-slate-100 rounded-xl font-semibold">Batal</button>
                        <button type="submit" class="px-4 py-2 text-xs bg-blue-600 text-white rounded-xl font-semibold">Simpan</button>
                    </div>
                </form>
            `);
        };

        window.saveLibrary = async function(e, id) {
            e.preventDefault();
            const existing = id ? appState.data.library.find(x => x.id === id) : null;
            const att = await extractAttachmentData(existing);
            if (!att) return;
            const obj = {
                id: id || 'lib-' + Date.now(),
                title: document.getElementById('lb-title').value,
                category: document.getElementById('lb-cat').value,
                author: document.getElementById('lb-auth').value,
                link: att.attachmentUrl || '',
                ...att
            };
            if (id) {
                const i = appState.data.library.findIndex(x => x.id === id);
                if (i !== -1) appState.data.library[i] = obj;
            } else {
                appState.data.library.unshift(obj);
            }
            closeModal();
            saveToCloud("Perpustakaan & lampiran diperbarui!");
        };

        // Shared Attachment Form Helper (Supports Local File Upload or External Link)
        function renderAttachmentFormFields(type = 'none', name = '', url = '', hideNone = false) {
            const safeUrl = type === 'link' ? url : '';
            return `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                            <i data-lucide="paperclip" class="w-3.5 h-3.5 text-indigo-600"></i> Lampiran (File / Link)
                        </label>
                        <select id="att-type" onchange="toggleAttachmentInputs(this.value)" class="text-[11px] font-semibold bg-white border border-slate-200 rounded-lg px-2 py-1 outline-none">
                            ${!hideNone ? `<option value="none" ${type === 'none' ? 'selected' : ''}>Tanpa Lampiran</option>` : ''}
                            <option value="link" ${type === 'link' ? 'selected' : ''}>Tautan / Link URL</option>
                            <option value="file" ${type === 'file' ? 'selected' : ''}>File dari Perangkat</option>
                        </select>
                    </div>

                    <div id="att-link-box" class="${type === 'link' ? '' : 'hidden'} space-y-2">
                        <div>
                            <label class="text-[11px] font-semibold text-slate-600">Nama Tautan (Opsional)</label>
                            <input type="text" id="att-link-name" value="${type === 'link' ? name : ''}" placeholder="Contoh: Soal Latihan PDF" class="w-full mt-0.5 text-xs bg-white border border-slate-200 rounded-xl px-3 py-1.5">
                        </div>
                        <div>
                            <label class="text-[11px] font-semibold text-slate-600">URL / Link</label>
                            <input type="url" id="att-link-url" value="${safeUrl}" placeholder="https://..." class="w-full mt-0.5 text-xs bg-white border border-slate-200 rounded-xl px-3 py-1.5">
                        </div>
                    </div>

                    <div id="att-file-box" class="${type === 'file' ? '' : 'hidden'} space-y-1.5">
                        <label class="text-[11px] font-semibold text-slate-600 block">Pilih File dari Perangkat (Maks. 700 KB agar tersimpan di Cloud)</label>
                        <input type="file" id="att-file-input" class="w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200">
                        ${type === 'file' && name ? `<p class="text-[11px] text-emerald-700 font-medium">File saat ini: ${name} (biarkan kosong jika tidak diganti)</p>` : ''}
                    </div>
                </div>
            `;
        }

        window.toggleAttachmentInputs = function(val) {
            const linkBox = document.getElementById('att-link-box');
            const fileBox = document.getElementById('att-file-box');
            if (linkBox) linkBox.classList.toggle('hidden', val !== 'link');
            if (fileBox) fileBox.classList.toggle('hidden', val !== 'file');
        };

        async function extractAttachmentData(existingItem) {
            const typeEl = document.getElementById('att-type');
            if (!typeEl) return { attachmentType: 'none', attachmentName: '', attachmentUrl: '' };
            const type = typeEl.value;

            if (type === 'none') {
                return { attachmentType: 'none', attachmentName: '', attachmentUrl: '' };
            }
            if (type === 'link') {
                const url = document.getElementById('att-link-url').value.trim();
                const name = document.getElementById('att-link-name').value.trim() || url;
                if (!url) {
                    showToast("Masukkan URL tautan lampiran terlebih dahulu!", "error");
                    return null;
                }
                return { attachmentType: 'link', attachmentName: name, attachmentUrl: url };
            }
            if (type === 'file') {
                const fileInput = document.getElementById('att-file-input');
                const file = fileInput && fileInput.files ? fileInput.files[0] : null;
                if (!file) {
                    if (existingItem && existingItem.attachmentType === 'file' && existingItem.attachmentUrl) {
                        return {
                            attachmentType: 'file',
                            attachmentName: existingItem.attachmentName,
                            attachmentUrl: existingItem.attachmentUrl
                        };
                    }
                    showToast("Silakan pilih file dari perangkat terlebih dahulu!", "error");
                    return null;
                }
                if (file.size > 700 * 1024) {
                    showToast("Ukuran file maksimal 700 KB agar dapat disinkronkan ke Cloud!", "error");
                    return null;
                }
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        resolve({
                            attachmentType: 'file',
                            attachmentName: file.name,
                            attachmentUrl: reader.result
                        });
                    };
                    reader.onerror = () => {
                        showToast("Gagal membaca file dari perangkat.", "error");
                        resolve(null);
                    };
                    reader.readAsDataURL(file);
                });
            }
            return { attachmentType: 'none', attachmentName: '', attachmentUrl: '' };
        }

        // ==========================================
        // 10. MODAL & TOAST UTILITIES
        // ==========================================
        function openModal(innerHtml) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = innerHtml;
            overlay.classList.remove('hidden');
            lucide.createIcons();
        }

        window.closeModal = function() {
            document.getElementById('modal-overlay').classList.add('hidden');
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white'
            };
            toast.className = `${colors[type] || colors.info} px-4 py-2.5 rounded-2xl shadow-lg text-xs font-semibold flex items-center gap-2 transform transition-all duration-300 translate-y-0 opacity-100`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // ==========================================
        // 11. BOOTSTRAP APPLICATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            updateHeaderUI();
            renderCurrentView();
            initCloudSync();
            window.addEventListener('online', () => { cloudRetry = 0; initCloudSync(); });
            document.addEventListener('visibilitychange', () => { if (!document.hidden && !appState.isCloudReady) { cloudRetry = 0; initCloudSync(); } });
        });
    </script>
</body>
</html>
